{% extends "derby/base.html" %}
{% block title %}Derby Registration{% endblock %}
{% block content %}
<h1>Derby Registration</h1>
<P>Please make sure you have weighed the car and ensured it fits in the sizing box first.</P>

<form method="POST" enctype="multipart/form-data" id="registerForm">
    {% csrf_token %}
    <table>
        {{ form.as_table }}
    </table>
    <div id="imagePreview" style="margin: 10px 0; display: none;">
        <p><strong>Image Preview:</strong></p>
        <img id="preview" style="max-width: 200px; max-height: 200px; border: 1px solid #ccc;" />
    </div>
    <input type="submit" value="Submit">
</form>

<script>
// Resize and show preview of captured/selected image
document.addEventListener('DOMContentLoaded', function() {
    const fileInput = document.querySelector('input[type="file"][name="picture"]');
    const preview = document.getElementById('preview');
    const previewContainer = document.getElementById('imagePreview');
    const MAX_WIDTH = 800;
    const MAX_HEIGHT = 800;
    const QUALITY = 0.85;
    
    if (fileInput) {
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file && file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        // Calculate new dimensions while maintaining aspect ratio
                        let width = img.width;
                        let height = img.height;
                        
                        if (width > height) {
                            if (width > MAX_WIDTH) {
                                height = Math.round((height * MAX_WIDTH) / width);
                                width = MAX_WIDTH;
                            }
                        } else {
                            if (height > MAX_HEIGHT) {
                                width = Math.round((width * MAX_HEIGHT) / height);
                                height = MAX_HEIGHT;
                            }
                        }
                        
                        // Create canvas and resize
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        // Show preview
                        preview.src = canvas.toDataURL('image/jpeg', QUALITY);
                        previewContainer.style.display = 'block';
                        
                        // Convert canvas to blob and replace file input
                        canvas.toBlob(function(blob) {
                            const resizedFile = new File([blob], file.name, {
                                type: 'image/jpeg',
                                lastModified: Date.now()
                            });
                            
                            // Replace the file input with resized version
                            const dataTransfer = new DataTransfer();
                            dataTransfer.items.add(resizedFile);
                            fileInput.files = dataTransfer.files;
                        }, 'image/jpeg', QUALITY);
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            } else {
                previewContainer.style.display = 'none';
            }
        });
    }
});
</script>

{% endblock %}
